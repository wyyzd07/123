<style>
        body { background-color: #f3f4f6; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .phone-container { width: 375px; height: 812px; background: white; border-radius: 40px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); position: relative; overflow: hidden; border: 8px solid #1f2937; }
        .status-bar { height: 44px; padding: 0 24px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 600; }
        .content-scroll { height: calc(812px - 44px - 80px); overflow-y: auto; scrollbar-width: none; position: relative; }
        .content-scroll::-webkit-scrollbar { display: none; }
        .tab-bar { height: 80px; border-top: 1px solid #f3f4f6; display: flex; justify-content: space-around; align-items: center; background: white; position: absolute; bottom: 0; width: 100%; padding-bottom: 20px; z-index: 20; }
        .active-tab { color: #92400e; }
        
        /* Map specific styles */
        .map-container {
            width: 100%;
            height: 100%;
            background-color: #e5e7eb;
            position: relative;
        }
        .map-placeholder {
            width: 100%;
            height: 100%;
            background-image: url('https://api.map.baidu.com/staticimage/v2?ak=fake_key&center=121.437151,31.171802&zoom=16&width=375&height=600&markers=121.437151,31.171802&markerStyles=l,A');
            background-size: cover;
            background-position: center;
        }
        .info-card {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            background: white;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }
        .nav-btn {
            position: absolute;
            bottom: 30px;
            left: 20px;
            right: 20px;
            background: #92400e;
            color: white;
            padding: 16px;
            border-radius: 16px;
            text-align: center;
            font-weight: bold;
            box-shadow: 0 10px 15px -3px rgba(146, 64, 14, 0.3);
            z-index: 10;
        }
    </style>
</head>
